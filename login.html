<!doctype html>
<html lang="pt-BR">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#090909"
  >

  <title>
    Entrar | Crazy Chicken
  </title>

  <link
    rel="icon"
    type="image/png"
    href="/assets/crazy-chicken-icon.png"
  >

  <link
    rel="apple-touch-icon"
    href="/assets/crazy-chicken-icon.png"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;

      font-family:
        Inter,
        Arial,
        sans-serif;

      background: #090909;

      color: #fff;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    [hidden] {
      display: none !important;
    }

    body {
      background:
        radial-gradient(
          circle at 10% 0,
          rgba(239,43,45,.14),
          transparent 28rem
        ),
        #090909;
    }

    .page {
      min-height: 100vh;

      display: grid;

      grid-template-columns:
        1.05fr
        0.95fr;
    }

    .hero {
      padding: 44px;

      display: flex;

      flex-direction: column;

      justify-content: space-between;

      border-right:
        1px solid
        #282828;
    }

    .brand {
      display: flex;

      align-items: center;

      gap: 12px;

      font-size: 21px;

      font-weight: 900;
    }

    .logo {
      width: 44px;
      height: 44px;

      border-radius: 13px;

      overflow: hidden;

      display: block;

      box-shadow:
        0 12px 30px
        rgba(239,43,45,.25);
    }

    .logo img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .brand small {
      display: block;

      font-size: 9px;

      color: #8f8f8f;

      text-transform: uppercase;

      letter-spacing: .18em;

      margin-top: 3px;

      font-weight: 600;
    }

    .hero-copy {
      max-width: 680px;

      padding: 70px 0;
    }

    .kicker {
      color: #ff7678;

      font-size: 12px;

      text-transform: uppercase;

      letter-spacing: .18em;

      font-weight: 800;
    }

    .hero h1 {
      font-size:
        clamp(
          50px,
          7vw,
          90px
        );

      line-height: .92;

      letter-spacing: -.07em;

      margin: 16px 0 22px;
    }

    .hero h1 span {
      color: #ef2b2d;
    }

    .hero p {
      color: #aaa;

      line-height: 1.7;

      max-width: 580px;
    }

    .hero-foot {
      color: #666;

      font-size: 12px;
    }

    .auth-side {
      display: grid;

      place-items: center;

      padding: 32px;
    }

    .card {
      width:
        min(
          480px,
          100%
        );

      background:
        linear-gradient(
          145deg,
          #151515,
          #101010
        );

      border:
        1px solid
        #292929;

      border-radius: 24px;

      padding: 30px;

      box-shadow:
        0 28px 80px
        rgba(0,0,0,.35);
    }

    .card h2 {
      font-size: 32px;

      margin: 0 0 8px;
    }

    .sub {
      color: #999;

      line-height: 1.6;

      margin: 0 0 22px;
    }

    .tabs {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      background: #0b0b0b;

      border:
        1px solid
        #292929;

      border-radius: 13px;

      padding: 5px;

      gap: 6px;

      margin-bottom: 22px;
    }

    .auth-tab {
      border: 0;

      background: transparent;

      color: #888;

      padding: 12px;

      border-radius: 9px;

      font-weight: 800;

      cursor: pointer;
    }

    .auth-tab.active {
      background: #ef2b2d;

      color: #fff;
    }

    .form {
      display: grid;

      gap: 14px;
    }

    .field {
      display: grid;

      gap: 7px;
    }

    .field label {
      font-size: 13px;

      color: #d8d8d8;

      font-weight: 700;
    }

    .input-wrap {
      position: relative;
    }

    .input {
      width: 100%;

      min-height: 48px;

      padding: 12px 14px;

      border:
        1px solid
        #303030;

      border-radius: 11px;

      background: #090909;

      color: #fff;

      outline: 0;
    }

    .input:focus {
      border-color: #ef2b2d;

      box-shadow:
        0 0 0 3px
        rgba(239,43,45,.1);
    }

    .with-action {
      padding-right: 86px;
    }

    .toggle {
      position: absolute;

      right: 8px;

      top: 50%;

      transform:
        translateY(-50%);

      border: 0;

      background: transparent;

      color: #999;

      font-size: 12px;

      cursor: pointer;
    }

    .btn {
      min-height: 48px;

      border: 0;

      border-radius: 11px;

      font-weight: 850;

      cursor: pointer;
    }

    .btn.primary {
      background:
        linear-gradient(
          145deg,
          #ef2b2d,
          #b9191c
        );

      color: #fff;
    }

    .btn.secondary {
      background: #1b1b1b;

      color: #fff;

      border:
        1px solid
        #303030;
    }

    .links {
      display: flex;

      justify-content:
        space-between;

      gap: 10px;

      flex-wrap: wrap;

      margin-top: 4px;
    }

    .link-btn {
      border: 0;

      background: transparent;

      color: #999;

      padding: 0;

      cursor: pointer;

      font-size: 12px;
    }

    .back {
      display: inline-block;

      margin-top: 20px;

      color: #aaa;

      font-size: 13px;
    }

    .setup-warning {
      position: fixed;

      top: 0;

      left: 0;

      right: 0;

      z-index: 999;

      padding: 10px;

      background: #ffe38a;

      color: #241d00;

      text-align: center;
    }

    .toast-root {
      position: fixed;

      right: 18px;

      bottom: 18px;

      z-index: 1000;

      display: grid;

      gap: 10px;
    }

    .toast {
      background: #191919;

      border:
        1px solid
        #333;

      color: #fff;

      padding: 13px 16px;

      border-radius: 11px;

      opacity: 0;

      transform:
        translateY(8px);

      transition: .2s;

      max-width: 360px;
    }

    .toast.show {
      opacity: 1;

      transform: none;
    }

    .toast-success {
      border-color: #23663e;
    }

    .toast-error {
      border-color: #76282c;
    }

    @media(max-width:900px) {

      .page {
        grid-template-columns: 1fr;
      }

      .hero {
        min-height: auto;

        border-right: 0;

        border-bottom:
          1px solid
          #282828;

        padding: 24px;
      }

      .hero-copy {
        padding: 44px 0 20px;
      }

      .hero-foot {
        display: none;
      }

      .auth-side {
        padding:
          24px 16px 50px;
      }

      .hero h1 {
        font-size: 56px;
      }
    }
  </style>

</head>


<body>

  <main class="page">


    <section class="hero">

      <a
        class="brand"
        href="/index.html"
      >

        <span class="logo">

          <img
            src="/assets/crazy-chicken-icon.png"
            alt="Crazy Chicken"
          >

        </span>

        <span>

          Crazy Chicken

          <small>
            área do cliente
          </small>

        </span>

      </a>


      <div class="hero-copy">

        <div class="kicker">
          Conta segura
        </div>

        <h1>

          Entre.
          <br>

          Escolha.
          <br>

          <span>
            Peça.
          </span>

        </h1>

        <p>

          Faça login para salvar seus dados,
          acompanhar pedidos e finalizar compras
          com mais rapidez.

        </p>

      </div>


      <div class="hero-foot">
        Crazy Chicken Ecommerce
      </div>

    </section>


    <section class="auth-side">

      <div class="card">

        <h2 id="authTitle">
          Bem-vindo
        </h2>

        <p
          class="sub"
          id="authSubtitle"
        >
          Entre na sua conta para continuar.
        </p>


        <div
          class="tabs"
          id="authTabs"
        >

          <button
            class="auth-tab active"
            type="button"
            data-tab="login"
          >
            Entrar
          </button>

          <button
            class="auth-tab"
            type="button"
            data-tab="signup"
          >
            Criar conta
          </button>

        </div>


        <form
          class="form"
          id="loginForm"
        >

          <div class="field">

            <label for="loginEmail">
              E-mail
            </label>

            <input
              class="input"
              id="loginEmail"
              type="email"
              autocomplete="email"
              required
            >

          </div>


          <div class="field">

            <label for="loginPassword">
              Senha
            </label>

            <div class="input-wrap">

              <input
                class="input with-action"
                id="loginPassword"
                type="password"
                autocomplete="current-password"
                required
              >

              <button
                class="toggle"
                type="button"
                data-toggle-password="loginPassword"
              >
                Mostrar
              </button>

            </div>

          </div>


          <button
            class="btn primary"
            id="loginButton"
            type="submit"
          >
            Entrar
          </button>


          <div class="links">

            <button
              class="link-btn"
              id="forgotButton"
              type="button"
            >
              Esqueci minha senha
            </button>

            <a
              class="link-btn"
              href="/index.html"
            >
              Voltar à loja
            </a>

          </div>

        </form>


        <form
          class="form"
          id="signupForm"
          hidden
        >

          <div class="field">

            <label for="signupName">
              Nome
            </label>

            <input
              class="input"
              id="signupName"
              type="text"
              autocomplete="name"
              required
            >

          </div>


          <div class="field">

            <label for="signupEmail">
              E-mail
            </label>

            <input
              class="input"
              id="signupEmail"
              type="email"
              autocomplete="email"
              required
            >

          </div>


          <div class="field">

            <label for="signupPassword">
              Senha
            </label>

            <div class="input-wrap">

              <input
                class="input with-action"
                id="signupPassword"
                type="password"
                minlength="8"
                autocomplete="new-password"
                required
              >

              <button
                class="toggle"
                type="button"
                data-toggle-password="signupPassword"
              >
                Mostrar
              </button>

            </div>

          </div>


          <div class="field">

            <label for="signupPasswordConfirm">
              Confirmar senha
            </label>

            <div class="input-wrap">

              <input
                class="input with-action"
                id="signupPasswordConfirm"
                type="password"
                minlength="8"
                autocomplete="new-password"
                required
              >

              <button
                class="toggle"
                type="button"
                data-toggle-password="signupPasswordConfirm"
              >
                Mostrar
              </button>

            </div>

          </div>


          <button
            class="btn primary"
            id="signupButton"
            type="submit"
          >
            Criar minha conta
          </button>


          <button
            class="link-btn"
            type="button"
            data-back-login
          >
            Já tenho conta
          </button>

        </form>


        <form
          class="form"
          id="resetForm"
          hidden
        >

          <div class="field">

            <label for="resetEmail">
              E-mail
            </label>

            <input
              class="input"
              id="resetEmail"
              type="email"
              required
            >

          </div>


          <button
            class="btn primary"
            id="resetButton"
            type="submit"
          >
            Enviar recuperação
          </button>


          <button
            class="btn secondary"
            type="button"
            data-back-login
          >
            Voltar ao login
          </button>

        </form>


        <form
          class="form"
          id="newPasswordForm"
          hidden
        >

          <div class="field">

            <label for="newPassword">
              Nova senha
            </label>

            <input
              class="input"
              id="newPassword"
              type="password"
              minlength="8"
              required
            >

          </div>


          <button
            class="btn primary"
            id="newPasswordButton"
            type="submit"
          >
            Salvar nova senha
          </button>

        </form>


        <a
          class="back"
          href="/index.html"
        >
          ← Voltar para a loja
        </a>

      </div>

    </section>

  </main>


  <div
    id="toastRoot"
    class="toast-root"
  ></div>


  <script
    type="module"
    src="/js/auth.js"
  ></script>

</body>
</html>
